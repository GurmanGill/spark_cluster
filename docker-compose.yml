services:
  spark-master:
    image: spark:4.2.0-python3
    container_name: spark-master
    hostname: spark-master

    cpus: 2.0
    mem_limit: 1g

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master

    ports:
      - "8080:8080"

    volumes:
      - ./jobs:/jobs
      - ./data:/data

    networks:
      - spark-net


  spark-worker-1:
    image: spark:4.2.0-python3
    container_name: spark-worker-1
    hostname: spark-worker-1

    cpus: 0.5
    mem_limit: 512m

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077

    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 384m

    depends_on:
      - spark-master

    volumes:
      - ./jobs:/jobs
      - ./data:/data

    networks:
      - spark-net


  spark-worker-2:
